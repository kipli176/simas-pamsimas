services:
  simas:
    build: .
    container_name: simas
    restart: unless-stopped
    environment:
      - DB_PATH=/data/pamsimas.db
      - UPLOAD_DIR=/data/uploads
      - FLASK_DEBUG=0
      # ganti nilai berikut sebelum dipakai sungguhan:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-12345678}
      - PIN_PETUGAS=${PIN_PETUGAS:-123456}
      - SECRET_KEY=${SECRET_KEY:-pamsimas-secret-key-ubah-ini}
      # Cloudflare Turnstile (ganti dengan key asli dari dashboard Cloudflare):
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    volumes:
      # folder ./data di host dipasang ke /data di container:
      # taruh pamsimas.db di ./data/ untuk dipakai aplikasi (termasuk uploads foto)
      - ./data:/data
    networks:
      - cloudflared

networks:
  cloudflared:
    external: true
